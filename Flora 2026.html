<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flora 2026 · ECTA Saint-Alban 22</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23e8357a'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--rose:#e8357a;--cyan:#00b4d8;--gris-clair:#e8e4ed;--texte:#1c1c2e;--blanc:#ffffff;--radius:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:'Nunito',sans-serif;background:#f8f7fb;color:var(--texte)}
    body{padding:1.5rem;display:flex;justify-content:center}
    .page-wrapper{width:min(940px,100%);}
    .panel{background:#ffffff;border:1px solid var(--gris-clair);border-radius:var(--radius);box-shadow:0 18px 40px rgba(0,0,0,0.08);padding:2rem;}
    .panel h1{font-family:'Barlow Condensed',sans-serif;font-size:2rem;letter-spacing:.05em;margin-bottom:1.35rem;color:#1f1f35}
    .filter-panel{display:grid;gap:1rem;margin-bottom:2rem;padding:1.5rem;border:1px solid #f0f0f4;border-radius:var(--radius);background:rgba(232,53,122,0.05)}
    .filter-panel label{display:block;font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4e4e66;margin-bottom:.35rem}
    .filter-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:flex-end}
    .filter-row input,.filter-row select{width:100%;padding:.95rem 1rem;border:1px solid #d7d3db;border-radius:12px;background:#fff;font-size:1rem;color:#1c1c2e}
    .filter-help{font-size:.95rem;color:#4a4a5a;line-height:1.6}
    .video-wrap{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,0.1);margin-bottom:1.5rem}
    .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
    .download-box{display:flex;justify-content:center}
    .download-link a{display:inline-flex;align-items:center;justify-content:center;padding:.95rem 1.4rem;border-radius:999px;background:linear-gradient(135deg,#e8357a 0%,#00b4d8 100%);color:#fff;font-weight:700;text-decoration:none;transition:transform .2s,box-shadow .2s;box-shadow:0 12px 24px rgba(232,53,122,0.2)}
    .download-link a:hover{transform:translateY(-2px);box-shadow:0 18px 30px rgba(232,53,122,0.25)}
    @media(max-width:760px){.filter-row{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="page-wrapper">
    <main class="panel">
      <h1>Flora 2026</h1>
      <section class="filter-panel" aria-label="Tri et recherche">
        <div class="filter-row">
          <div>
            <label for="sortBy">Trier</label>
            <select id="sortBy" name="sortBy">
              <option value="recent">Plus récent</option>
              <option value="ancien">Plus ancien</option>
              <option value="alphabetique">A → Z</option>
            </select>
          </div>
          <div>
            <label for="searchText">Rechercher</label>
            <input id="searchText" name="searchText" type="text" placeholder="Tapez un mot-clé…" />
          </div>
        </div>
        <p class="filter-help">Utilisez ce tri et cette recherche pour retrouver rapidement les photos et les informations de la randonnée.</p>
      </section>
      <section class="video-section">
        <div class="video-wrap">
          <iframe src="https://www.youtube.com/embed/97z-c_4Gkvo" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        <div class="download-box download-link">
          <a href="https://drive.google.com/drive/folders/1MFtAMK8eJzBpKcZrZbuoqPb_WXU3rD1R" target="_blank" rel="noopener">Télécharger les photos de la randonnée Flora 2026</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
